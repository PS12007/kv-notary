<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="900" height="300" rx="12" fill="#fcfcfb"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
  </defs>

  <!-- untrusted prefill worker -->
  <rect x="24" y="70" width="190" height="120" rx="10" fill="#fff" stroke="#c9c8c3"/>
  <text x="119" y="98" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Prefill worker</text>
  <text x="119" y="118" text-anchor="middle" font-size="12" fill="#e34948">untrusted</text>
  <text x="119" y="146" text-anchor="middle" font-size="12" fill="#52514e">reads the document,</text>
  <text x="119" y="163" text-anchor="middle" font-size="12" fill="#52514e">builds its KV cache</text>

  <!-- cache -->
  <line x1="214" y1="130" x2="300" y2="130" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <text x="257" y="120" text-anchor="middle" font-size="11" fill="#52514e">ships</text>
  <g transform="translate(306,62)">
    <text x="130" y="-12" text-anchor="middle" font-size="13" font-weight="600" fill="#0b0b0b">KV cache: one column per token</text>
    <g fill="#9cc0ec">
      <rect x="0" y="0" width="14" height="136" rx="2" fill="#c9c8c3"/><rect x="18" y="0" width="14" height="136" rx="2" fill="#c9c8c3"/>
      <rect x="36" y="0" width="14" height="136" rx="2" fill="#c9c8c3"/><rect x="54" y="0" width="14" height="136" rx="2" fill="#c9c8c3"/>
      <rect x="72" y="0" width="14" height="136" rx="2"/><rect x="90" y="0" width="14" height="136" rx="2"/>
      <rect x="108" y="0" width="14" height="136" rx="2"/><rect x="126" y="0" width="14" height="136" rx="2" fill="#e34948"/>
      <rect x="144" y="0" width="14" height="136" rx="2"/><rect x="162" y="0" width="14" height="136" rx="2"/>
      <rect x="180" y="0" width="14" height="136" rx="2"/><rect x="198" y="0" width="14" height="136" rx="2"/>
      <rect x="216" y="0" width="14" height="136" rx="2"/><rect x="234" y="0" width="14" height="136" rx="2"/>
    </g>
    <text x="133" y="158" text-anchor="middle" font-size="11" fill="#e34948">one forged column flips the answer</text>
    <text x="27" y="158" text-anchor="middle" font-size="11" fill="#8a8984">sinks</text>
  </g>

  <!-- decode node -->
  <line x1="560" y1="130" x2="640" y2="130" stroke="#52514e" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="646" y="40" width="230" height="220" rx="10" fill="#fff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="761" y="66" text-anchor="middle" font-size="15" font-weight="600" fill="#0b0b0b">Decode node + notary</text>
  <text x="761" y="85" text-anchor="middle" font-size="12" fill="#1baf7a">trusted: has the token ids</text>
  <text x="664" y="114" font-size="12" fill="#0b0b0b">1. answer the question,</text>
  <text x="680" y="130" font-size="12" fill="#52514e">see which columns it reads</text>
  <text x="664" y="156" font-size="12" fill="#0b0b0b">2. recompute a few columns</text>
  <text x="680" y="172" font-size="12" fill="#52514e">(1 token each) and compare</text>
  <text x="664" y="198" font-size="12" fill="#0b0b0b">3. trace what those read,</text>
  <text x="680" y="214" font-size="12" fill="#52514e">add random columns</text>
  <text x="761" y="244" text-anchor="middle" font-size="12" font-weight="600" fill="#2a78d6">ACCEPT or REJECT</text>
</svg>
